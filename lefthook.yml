# https://biomejs.dev/recipes/git-hooks/#lefthook
pre-commit:
  commands:
    check:
      root: packages/
      glob: '**/*.{js,ts,jsx,tsx,cjs,mjs,d.cts,d.mts,json,jsonc,css}'
      run: npx @biomejs/biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true
